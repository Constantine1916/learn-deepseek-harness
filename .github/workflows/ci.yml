name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: 22.19.0
          - os: ubuntu-24.04
            node: 24.x
          - os: macos-latest
            node: 22.19.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out Learn DSH
        uses: actions/checkout@v4
        with:
          path: learn-deepseek-harness

      - name: Check out supported DSH source baseline
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: a66e4702047846cdaa10c66c9d3df3951f5ea70d
          path: deepseek-harness

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Provision Linux sandbox backend
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes apparmor-profiles apparmor-utils bubblewrap
          test "$(sysctl --values kernel.apparmor_restrict_unprivileged_userns)" = '1'
          sudo apparmor_parser --replace /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          bwrap --version
          bwrap --ro-bind / / --dev /dev --proc /proc --die-with-parent -- true

      - name: Install Learn DSH and registry DSH
        working-directory: learn-deepseek-harness
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        working-directory: learn-deepseek-harness
        run: pnpm check

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node }}
          path: learn-deepseek-harness/coverage
          if-no-files-found: ignore
